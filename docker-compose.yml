
version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: algorush_db
    environment:
      POSTGRES_DB: algorush
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - algorush_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  algorush_db_data: